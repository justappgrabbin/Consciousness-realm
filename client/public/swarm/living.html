if (window.__GENOME) document.getElementById("childout").textContent = `I am a child: born ${window.__GENOME.born}, from "${window.__GENOME.request}"${window.__GENOME.extra ? " (" + window.__GENOME.extra + ")" : ""}; I started from what my parent learned.`;

// ---- birth: rebuild the swarm from anyone's four charts ----
{ const bz = document.getElementById("bzone"); bz.value = BIRTH.zone || Intl.DateTimeFormat().resolvedOptions().timeZone; if (BIRTH.date) document.getElementById("bdate").value = BIRTH.date; if (BIRTH.time) document.getElementById("btime").value = BIRTH.time;
  document.getElementById("bstat").textContent = CHARTS ? `four charts · design moment ${CHARTS.designUtc.slice(0, 16)}Z · ${Object.entries(CHARTS.charts).map(([d, c]) => d + ": " + c.system).join(" · ")}` : "using the sample chart — enter birth data to build from yours";
  document.getElementById("bgo").onclick = () => { const q = new URLSearchParams(location.search); q.set("date", document.getElementById("bdate").value); q.set("time", document.getElementById("btime").value || "12:00"); q.set("zone", bz.value.trim() || "UTC");
    if (!q.get("date")) { document.getElementById("bstat").textContent = "enter a birth date first"; return; } location.search = q.toString(); }; }

// ---- the trained five-dimension neural net (swarm_model.js + trained_swarm.json), run on each chart's 26 units ----
import { SwarmModel, buildGraph, PRIMARY_NAMES } from "./swarm_model.js";
{ const NN = new SwarmModel(await fetch("./trained_swarm.json").then(r => r.json())); window.__NN = NN;
  const think = () => { const groups = {}; for (const u of S.units) if (!u.latent && !u.broken && u.address.field) (groups[u.address.field] ??= []).push(u);
    const lines = [];
    for (const [field, us] of Object.entries(groups)) { if (us.length !== 26) continue;
      const g = buildGraph(us.map(u => u.address), 8), { X, five } = NN.inputs(g.A, g.D, us.map(u => u.address.gate)), out = NN.forward(g.W, X);
      us.forEach((u, i) => { u.nn = { five: Object.fromEntries(PRIMARY_NAMES.map((n, k) => [n, +five[i][k].toFixed(2)])), type: NN.types[out.pred[i]], p: Math.max(...out.probs[i]) }; });
      const votes = {}; for (const u of us) votes[u.nn.type] = (votes[u.nn.type] ?? 0) + 1; const top = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
      lines.push(`${field}: reads as ${top[0]} (${top[1]}/26 units)`); }
    document.getElementById("nn").textContent = lines.length ? "neural net (trained, 71% on its test set): " + lines.join(" · ") : ""; };
  think(); setInterval(think, 3000); }

// ---- the kernel on the same units: +/0/- meeting, emergent nets, changing lines, address sentences ----
import { KernelBridge } from "./kernel_bridge.js";
{ const KB = new KernelBridge(S); window.__KB = KB;
  setInterval(() => KB.meetAll(), 250);
  setInterval(() => { const r = KB.step(), ch = { "1": 0, "0": 0, "-1": 0 }; for (const u of S.units) if (u.charge != null) ch[u.charge]++;
    document.getElementById("kern").textContent = `kernel: ${r.formations} nets · ${r.flips} line changes so far · charge +${ch["1"]} 0:${ch["0"]} −${ch["-1"]} · ${KB.meetings} meetings`; }, 1000);
  document.getElementById("c").addEventListener("click", () => setTimeout(() => { const u = S.units[picked ?? -1]; if (!u?.kp) return;
    info.textContent += `
sentence: ${KB.sentence(u)}
charge ${u.charge > 0 ? "+" : u.charge < 0 ? "−" : "0"} · tension ${(u.tension ?? 0).toFixed(2)}`
      + (u.current ? ` · now at gate ${u.current.gate}.${u.current.line} (changed from ${u.current.from}: ${u.current.cause}); born at ${u.address.gate}.${u.address.line}` : "")
      + (u.address.field ? ` · chart: ${u.address.field}` : "") + (u.latent ? " · latent (not activated, still part of the whole)" : "")
      + (u.nn ? `
neural net: reads ${u.nn.type} (${(u.nn.p * 100).toFixed(0)}%) · ${Object.entries(u.nn.five).map(([k, v]) => k + " " + v).join(" · ")}` : ""); }, 0)); }
</script></body></html>
